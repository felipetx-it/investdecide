<aside th:fragment="sidebar(activePage)" class="sidebar">
    <a class="brand" th:href="@{/dashboard}">
        <span class="brand-mark"><i class="bi bi-graph-up-arrow"></i></span>
        <span class="brand-copy"><strong>invest<span>decide</span></strong><small>INTELLIGENCE SUITE</small></span>
    </a>

    <div class="nav-caption">ESPAÇO DE TRABALHO</div>
    <nav class="side-nav" aria-label="Navegação principal">
        <a th:href="@{/dashboard}" th:classappend="${activePage == 'dashboard'} ? ' active' : ''">
            <i class="bi bi-grid-1x2"></i><span>Dashboard</span>
        </a>
        <a th:href="@{/simulacao}" th:classappend="${activePage == 'simulacao'} ? ' active' : ''">
            <i class="bi bi-sliders2"></i><span>Nova simulação</span><span class="nav-dot"></span>
        </a>
        <a th:href="@{/produtos}" th:classappend="${activePage == 'produtos'} ? ' active' : ''">
            <i class="bi bi-collection"></i><span>Produtos</span>
        </a>
        <a th:href="@{/cenarios}" th:classappend="${activePage == 'cenarios'} ? ' active' : ''">
            <i class="bi bi-graph-up"></i><span>Cenários</span>
        </a>
        <a th:href="@{/relatorios}" th:classappend="${activePage == 'relatorios'} ? ' active' : ''">
            <i class="bi bi-file-earmark-bar-graph"></i><span>Relatórios</span>
        </a>
    </nav>

    <div class="sidebar-bottom">
        <div class="help-card">
            <span class="help-icon"><i class="bi bi-lightbulb"></i></span>
            <strong>Decisão é índice, não intuição.</strong>
            <p>Elegibilidade, critérios e justificativa no mesmo fluxo.</p>
            <a th:href="@{/simulacao}">Criar simulação <i class="bi bi-arrow-up-right"></i></a>
        </div>
        <div class="sidebar-user">
            <div class="avatar" th:text="${usuarioAtual != null ? usuarioAtual.iniciais : 'MC'}">MC</div>
            <div class="user-meta">
                <strong th:text="${usuarioAtual != null ? usuarioAtual.nome : 'Mariana Costa'}">Mariana Costa</strong>
                <small th:text="${usuarioAtual != null ? usuarioAtual.cargo : 'Assessora de investimentos'}">Assessora de investimentos</small>
            </div>
            <form th:action="@{/logout}" method="post" class="sidebar-logout-form" title="Encerrar sessão">
                <button type="submit" class="sidebar-logout-btn" aria-label="Sair">
                    <i class="bi bi-box-arrow-right"></i>
                </button>
            </form>
        </div>
    </div>
</aside>
