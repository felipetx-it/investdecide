spring.application.name=InvestDecide
server.port=8080
spring.thymeleaf.cache=false

# Formatacao de numeros e datas no padrao brasileiro
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

# Pasta dos arquivos de dados (base da CVM e cenarios)
investdecide.dados=data

# Universo de analise: maiores fundos por patrimonio
investdecide.universo=150

# Janela de estimacao da regressao (meses)
investdecide.janela-regressao=24
