spring.application.name=InvestDecide
server.port=8080
spring.thymeleaf.cache=false

# Formatacao de numeros e datas no padrao brasileiro
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

# Pasta dos arquivos de dados (base da CVM e cenarios)
investdecide.dados=data

# Universo de analise: maiores fundos por patrimonio
investdecide.universo=150

# Janela de estimacao da regressao (meses)
investdecide.janela-regressao=24

# Banco relacional embarcado H2 (persistencia multiusuario em arquivo local)
spring.datasource.url=jdbc:h2:file:./data/db/investdecide;AUTO_COMPACT_FILL_RATE=0;MAX_COMPACT_TIME=0
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Contas iniciais de demonstracao. Vazio = a conta nao e criada.
# Em producao, informe as senhas por variavel de ambiente:
#   INVESTDECIDE_SEED_CONSULTOR_SENHA, INVESTDECIDE_SEED_ANALISTA_SENHA,
#   INVESTDECIDE_SEED_TESTE_SENHA
investdecide.seed.consultor.senha=
investdecide.seed.analista.senha=
investdecide.seed.teste.senha=
